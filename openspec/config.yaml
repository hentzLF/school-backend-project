schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules
rules:
  tasks:
    - Every task block (numbered section) MUST end with a git commit task as the last item, using conventional commit format. Example "- [ ] 2.8 Git commit: `feat: add County/Municipality seeding and Location migration`"
    - Tasks must be written in English
